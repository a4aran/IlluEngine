<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IlluEngine - Documentation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      display: flex;
      flex-direction: row;
    }

    #left {
      width: 70%;
      height: 100vh;
      display: flex;
      justify-content: center; /* Horizontal center */
      align-items: center;     /* Vertical center */
    }

    #left h1 {
      text-align: center;
    }
    
    #right {
      width: 30%;
      border-left: 2px solid black;
      height: 100vh;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="left">
    <h1>Illu Engine</h1>
  </div>

  <div id="right">
    <iframe src="./side-bar.html"></iframe>
  </div>
</body>
</html>
