<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar</title>
  <style>
    * {
      margin: 0;
      font-family: 'Noto Sans JP', sans-serif;
      box-sizing: border-box;
    }
    body {
      padding: 10px;
      padding-top: 20px;
    }
    ul {
      list-style: none;
      padding-left: 0;
    }
    li {
      position: relative;
    }
    /* wrapper row for link + button */
    .row {
      display: flex;
      align-items: center;
    }
    .row a {
      flex: 1;
      text-decoration: none;
      color: #333;
      padding: 6px 8px;
    }
    .row a:hover {
      background: #eee;
    }
    .toggle {
      width: 29%;
      height: 28px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 1.2em;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
      border: 2px solid #6a6a6a;
      border-radius: 5px;
      margin-left: 1%;
    }
    .toggle:hover {
        background: #eee;
    }

    .toggle::before {
      content: "▼";
      display: inline-block;
    }
    li.open > .row .toggle::before {
      content: "—";
    }
    /* nested lists hidden by default */
    li ul {
      display: none;
      margin-left: 20px;
      border-left: 1px solid #ccc;
      padding-left: 10px;
    }
    li.open > ul {
      display: block;
    }
  </style>
</head>
<body>
  <ul>
    <li>
      <div class="row">
        <a href="getting-started.html" target="_top">Start</a>
      </div>
    </li>
    <li>
      <div class="row">
        <a href="ui.html" target="_top">UI</a>
        <button class="toggle"></button>
      </div>
      <ul>
        <li>
          <div class="row">
            <a href="gui.html" target="_top">GUI</a>
            <button class="toggle"></button>
          </div>
          <ul>
            <li>
              <div class="row">
                <a href="button.html" target="_top">Button</a>
              </div>
            </li>
          </ul>
        </li>
        <li>
          <div class="row">
            <a href="hud.html" target="_top">HUD</a>
            <button class="toggle"></button>
          </div>
          <ul>
            <li>
              <div class="row">
                <a href="text-display.html" target="_top">Text</a>
              </div>
            </li>
          </ul>
        </li>
      </ul>
    </li>
  </ul>

  <script>
    document.querySelectorAll(".toggle").forEach(btn => {
      btn.addEventListener("click", e => {
        e.stopPropagation();
        const li = btn.closest("li");
        li.classList.toggle("open");
      });
    });
  </script>
</body>
</html>
